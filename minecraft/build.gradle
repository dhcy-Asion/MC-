plugins { id 'fabric-loom' version '1.8.13' }
version = '0.1.0'
group = 'local.crimsonmc'
base { archivesName = 'crimsonmc-authority' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.102.1+1.21.1'
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { withSourcesJar() }
loom {
    runs {
        server {
            runDir '../runtime/minecraft-server'
            vmArg '-Xmx2G'
            vmArg '-Dcrimsonmc.port=8766'
            programArg 'nogui'
        }
    }
}
